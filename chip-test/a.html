<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chip test A (with Beer)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/beercss@3.9.7/dist/cdn/beer.min.css">
<style>
:root { --primary:#f4a9cd; --on-primary:#5b233f; --surface-container:#2c2229; --surface-container-high:#3a2d34; --on-surface:#f2e4ea; --on-surface-variant:#d8c2cb; --outline-variant:#5a454f; --outline:#8a6d7a; }
body { background:#171114; color:#fff; font-family: Roboto, sans-serif; margin: 12px; }
.rowlabel { font-size: 13px; margin: 18px 0 6px; color:#f4a9cd; }
.chips { display:flex; gap:4px; overflow-x:auto; padding:5px 2px; background:#241a20; border-radius:12px; }
.gl-fchip { margin: 0; padding: .34rem .62rem; border-radius: 999px; border: 1px solid var(--outline-variant); background: var(--surface-container); color: var(--on-surface-variant); font-size: 11px; font-weight: 700; white-space: nowrap; cursor: pointer; height: 37px; block-size: 37px; min-height: 0; min-block-size: 0; inline-size: auto; min-inline-size: 0; box-sizing: border-box; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; box-shadow: none; }
.on-prod { background: var(--primary); color: var(--on-primary); border-color: transparent; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .16); }
.on-noshadow { background: var(--primary); color: var(--on-primary); border-color: transparent; }
.on-borderp { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.on-bgonly { background: var(--primary); color: var(--on-primary); }
</style></head><body>
<div class="rowlabel">Row1 production (.on = bg+color+border transparent+inset shadow)</div>
<div class="chips"><button type="button" class="gl-fchip">表示中</button><button type="button" class="gl-fchip on-prod">すべて</button><button type="button" class="gl-fchip">非表示</button></div>
<div class="rowlabel">Row2 .on without box-shadow</div>
<div class="chips"><button type="button" class="gl-fchip">表示中</button><button type="button" class="gl-fchip on-noshadow">すべて</button><button type="button" class="gl-fchip">非表示</button></div>
<div class="rowlabel">Row3 .on border-color = primary</div>
<div class="chips"><button type="button" class="gl-fchip">表示中</button><button type="button" class="gl-fchip on-borderp">すべて</button><button type="button" class="gl-fchip">非表示</button></div>
<div class="rowlabel">Row4 .on background+color only (border stays)</div>
<div class="chips"><button type="button" class="gl-fchip">表示中</button><button type="button" class="gl-fchip on-bgonly">すべて</button><button type="button" class="gl-fchip">非表示</button></div>
<div class="rowlabel">Row5 same classes on span elements (no button machinery)</div>
<div class="chips"><span class="gl-fchip">表示中</span><span class="gl-fchip on-prod">すべて</span><span class="gl-fchip">非表示</span></div>
<div class="rowlabel">Row6 production, selected button has autofocus</div>
<div class="chips"><button type="button" class="gl-fchip">表示中</button><button type="button" class="gl-fchip on-prod" autofocus>すべて</button><button type="button" class="gl-fchip">非表示</button></div>
</body></html>
