<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
<style>body{font-family:"M PLUS Rounded 1c",sans-serif;background:#e9e2e8;margin:0;padding:16px}h2{color:#402b3d;font-size:16px;margin:18px 0 8px}canvas{width:100%;max-width:430px;height:auto;display:block;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.18)}p{color:#57455c;font-size:12px}</style>
</head><body>
<p>シェア画像の新しいデザイン確認用ページです（サンプルデータで描画）。</p>
<h2>① お気に入り（行く予定）のシェア画像</h2>
<div id="slot1"></div>
<h2>② 推し活まとめのシェア画像</h2>
<div id="slot2"></div>
<script>
const SITE_URL = 'https://oshi-cal-info.github.io/my-idol-app/';
const summaryPeriod = 'month';
const groups = [
  { name: 'Onephony', color: '#3b82f6' },
  { name: 'わーすた', color: '#f59e0b' },
  { name: 'TENRIN', color: '#8b5cf6' },
  { name: 'AKANECLUB', color: '#10b981' },
  { name: 'myojou', color: '#ef4444' },
  { name: 'HzMe', color: '#06b6d4' },
  { name: 'マリークラウン', color: '#f43f5e' },
];
function getFavoriteLives() {
  return [
    [{ date: '2026-12-24', time: '17:45', group: 'AKANECLUB', title: '【🔥東京🔥】YON PIECE そして冒険ははじまった @ Zepp Shinjuku (TOKYO)' }, { date: '2026-12-24', time: '17:45', group: 'myojou', title: '【🔥東京🔥】YON PIECE そして冒険ははじまった @ Zepp Shinjuku (TOKYO)' }, { date: '2026-12-24', time: '17:45', group: 'HzMe', title: '【🔥東京🔥】YON PIECE そして冒険ははじまった @ Zepp Shinjuku (TOKYO)' }, { date: '2026-12-24', time: '17:45', group: 'マリークラウン', title: '【🔥東京🔥】YON PIECE そして冒険ははじまった @ Zepp Shinjuku (TOKYO)' }],
    [{ date: '2026-12-28', time: '15:00', group: 'わーすた', title: 'わーしっぷ大感謝祭2026 第1部' }],
    [{ date: '2026-12-28', time: '18:30', group: 'わーすた', title: 'わーしっぷ大感謝祭2026 第2部' }],
    [{ date: '2026-12-31', time: '22:45', group: 'わーすた', title: 'わーすたカウントダウンライブ2026→2027' }],
    [{ date: '2027-01-09', time: '00:00', group: 'Onephony', title: 'MARQUEE祭 mini' }],
    [{ date: '2027-01-17', time: '13:00', group: 'TENRIN', title: 'TENRIN ワンマンライブ' }],
    [{ date: '2027-02-14', time: '18:00', group: 'わーすた', title: 'わーすた ラストライブ' }],
  ];
}
function computeSummary() {
  return { label: '2026年11月', liveCount: 9, groupCount: 6, totalCheki: 14, totalSpend: 31500,
    topGroups: [['わーすた', 3], ['Onephony', 2], ['TENRIN', 2], ['AKANECLUB', 1], ['myojou', 1]],
    topVenues: [['Zepp Shinjuku', 2], ['竹芝ニューピアホール', 2], ['KANDA SQUARE HALL', 1]] };
}
let slot = 'slot1';
HTMLCanvasElement.prototype.toBlob = function () { document.getElementById(slot).appendChild(this); };
</script>
<script>
        const SHARE_FONT = '"M PLUS Rounded 1c", sans-serif';
        // シェア画像共通の柔らかい装飾（淡い円2つ＋小さなドット）
        function softBlobs_(ctx, W, H) {
            ctx.save();
            ctx.globalAlpha = 0.30;
            ctx.fillStyle = '#f9a8d4';
            ctx.beginPath(); ctx.arc(W - 40, 30, 190, 0, Math.PI * 2); ctx.fill();
            ctx.globalAlpha = 0.28;
            ctx.fillStyle = '#ddd6fe';
            ctx.beginPath(); ctx.arc(30, H - 30, 160, 0, Math.PI * 2); ctx.fill();
            ctx.globalAlpha = 0.5;
            ctx.fillStyle = '#f9a8d4';
            [[W - 270, 130, 7], [120, 215, 6], [W - 150, H - 200, 6], [70, H - 330, 5]].forEach(function (p) { ctx.beginPath(); ctx.arc(p[0], p[1], p[2], 0, Math.PI * 2); ctx.fill(); });
            ctx.restore();
        }
        // シェア画像共通のワードマーク（グラデーションのピルに白文字）
        function shareWordmark_(ctx, W, y, pad) {
            const label = 'Oshi-Cal';
            ctx.font = '800 27px ' + SHARE_FONT;
            const tw = ctx.measureText(label).width;
            const pw = tw + 44, ph = 52, px = W - pad - pw, py = y - 38;
            const g = ctx.createLinearGradient(px, py, px + pw, py + ph);
            g.addColorStop(0, '#f9a8d4');
            g.addColorStop(1, '#d8b4fe');
            ctx.fillStyle = g;
            drawRoundRect(ctx, px, py, pw, ph, ph / 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.fillText(label, px + 22, y);
        }

        function drawRoundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        function wrapTextLines(ctx, text, maxWidth, maxLines) {
            const lines = [];
            let current = '';
            for (const ch of String(text)) {
                if (ctx.measureText(current + ch).width > maxWidth && current) {
                    lines.push(current);
                    current = ch;
                } else {
                    current += ch;
                }
            }
            if (current) lines.push(current);
            if (lines.length <= maxLines) return lines;
            const kept = lines.slice(0, maxLines);
            kept[maxLines - 1] = truncateText(ctx, kept[maxLines - 1] + lines[maxLines], maxWidth);
            return kept;
        }

        function truncateText(ctx, text, maxWidth) {
            if (ctx.measureText(text).width <= maxWidth) return text;
            let t = text;
            while (t.length > 1 && ctx.measureText(t + '…').width > maxWidth) {
                t = t.slice(0, -1);
            }
            return t + '…';
        }

        async function shareImageOfFavorites() {
            const lives = getFavoriteLives();
            if (lives.length === 0) {
                alert('お気に入りのライブがまだありません');
                return;
            }
            try { await Promise.all([document.fonts.load('800 60px "M PLUS Rounded 1c"'), document.fonts.load('700 30px "M PLUS Rounded 1c"')]); } catch (e) {}

            const MAX_ITEMS = 40; // 画像に入れる最大件数
            const GRID_THRESHOLD = 6; // これより多いと2列（横並び）表示に切り替える
            const shown = lives.slice(0, MAX_ITEMS);
            const extra = lives.length - shown.length;
            const useGrid = shown.length > GRID_THRESHOLD;

            const WIDTH = 1080;
            const PAD = 56;
            const HEADER_H = 230;
            const COLS = useGrid ? 2 : 1;
            const COL_GAP = 24;
            const ROW_GAP = useGrid ? 24 : 28;
            const CARD_PAD = useGrid ? 26 : 32;
            const CHIP_H = useGrid ? 42 : 52;
            const CHIP_GAP = 10;
            const CHIP_FONT = useGrid ? '700 22px "M PLUS Rounded 1c", sans-serif' : '700 26px "M PLUS Rounded 1c", sans-serif';
            const CHIP_TEXT_PAD = useGrid ? 16 : 20;
            const DATE_FONT = useGrid ? '700 26px "M PLUS Rounded 1c", sans-serif' : '700 32px "M PLUS Rounded 1c", sans-serif';
            const DATE_H = useGrid ? 34 : 46;
            const TITLE_FONT = useGrid ? '700 30px "M PLUS Rounded 1c", sans-serif' : '700 38px "M PLUS Rounded 1c", sans-serif';
            const TITLE_LINE_H = useGrid ? 38 : 46;
            const TITLE_MAX_LINES = useGrid ? 2 : 1;
            const cardW = (WIDTH - PAD * 2 - COL_GAP * (COLS - 1)) / COLS;
            const contentWidth = cardW - CARD_PAD * 2;

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            // 各カードの中身と高さを先に計算する
            const cardsData = shown.map(list => {
                const rep = list[0];
                ctx.font = TITLE_FONT;
                const titleLines = wrapTextLines(ctx, rep.title, contentWidth, TITLE_MAX_LINES);

                ctx.font = CHIP_FONT;
                const chipRows = [[]];
                let rowWidth = 0;
                list.forEach(ev => {
                    const label = truncateText(ctx, ev.group || '個人の予定', contentWidth - CHIP_TEXT_PAD * 2);
                    const chipW = ctx.measureText(label).width + CHIP_TEXT_PAD * 2;
                    if (rowWidth + chipW > contentWidth && rowWidth > 0) {
                        chipRows.push([]);
                        rowWidth = 0;
                    }
                    chipRows[chipRows.length - 1].push({ ev, label, chipW });
                    rowWidth += chipW + CHIP_GAP;
                });

                const cardHeight = CARD_PAD * 2 + DATE_H + 12 + titleLines.length * TITLE_LINE_H + 14 + chipRows.length * (CHIP_H + 10) - 10;
                return { rep, titleLines, chipRows, cardHeight };
            });

            // 行ごとに並べる（2列のときは同じ行のカードの高さをそろえる）
            const rows = [];
            for (let i = 0; i < cardsData.length; i += COLS) {
                const rowCards = cardsData.slice(i, i + COLS);
                rows.push({ cards: rowCards, height: Math.max(...rowCards.map(c => c.cardHeight)) });
            }

            const totalRowsHeight = rows.reduce((sum, r) => sum + r.height + ROW_GAP, 0);
            const extraNoteH = extra > 0 ? 60 : 0;
            const footerH = 110;
            const HEIGHT = Math.round(HEADER_H + totalRowsHeight + extraNoteH + footerH + PAD);

            canvas.width = WIDTH;
            canvas.height = HEIGHT;

            const bg = ctx.createLinearGradient(0, 0, 0, HEIGHT);
            bg.addColorStop(0, '#fff8fb');
            bg.addColorStop(1, '#fdeef7');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            softBlobs_(ctx, WIDTH, HEIGHT);

            // ヘッダー：グラデーションの角丸バッジ＋タイトル（アプリの淡ピンク基調）
            const badgeG = ctx.createLinearGradient(PAD, 52, PAD + 92, 144);
            badgeG.addColorStop(0, '#f9a8d4');
            badgeG.addColorStop(1, '#d8b4fe');
            ctx.fillStyle = badgeG;
            drawRoundRect(ctx, PAD, 52, 92, 92, 26);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = '800 50px ' + SHARE_FONT;
            ctx.textAlign = 'center';
            ctx.fillText('推', PAD + 46, 118);
            ctx.textAlign = 'left';

            ctx.fillStyle = '#402b3d';
            ctx.font = '800 58px ' + SHARE_FONT;
            ctx.fillText('推し活スケジュール', PAD + 118, 112);

            ctx.fillStyle = '#96748c';
            ctx.font = '700 27px ' + SHARE_FONT;
            ctx.fillText(`MY LIVE SCHEDULE ・ 全${lives.length}件`, PAD + 118, 158);

            let y = HEADER_H;
            rows.forEach(row => {
                row.cards.forEach((card, colIndex) => {
                    const { rep, titleLines, chipRows } = card;
                    const x = PAD + colIndex * (cardW + COL_GAP);
                    const h = row.height;

                    ctx.fillStyle = '#ffffff';
                    ctx.shadowColor = 'rgba(221, 91, 157, 0.13)';
                    ctx.shadowBlur = 24;
                    ctx.shadowOffsetY = 8;
                    drawRoundRect(ctx, x, y, cardW, h, useGrid ? 28 : 36);
                    ctx.fill();
                    ctx.shadowColor = 'transparent';
                    ctx.shadowBlur = 0;
                    ctx.shadowOffsetY = 0;
                    ctx.strokeStyle = 'rgba(233, 150, 195, 0.45)';
                    ctx.lineWidth = 2;
                    drawRoundRect(ctx, x, y, cardW, h, useGrid ? 28 : 36);
                    ctx.stroke();

                    // 左端にグループ色のライン
                    const firstGroup = groups.find(g => g.name === rep.group);
                    ctx.fillStyle = firstGroup ? firstGroup.color : '#dd5b9d';
                    drawRoundRect(ctx, x + 10, y + 22, 6, h - 44, 3);
                    ctx.fill();

                    let cy = y + CARD_PAD;
                    const dateFormatted = dayjs(rep.date).isValid() ? dayjs(rep.date).format('M/D(dd)') : rep.date;
                    ctx.fillStyle = '#96748c';
                    ctx.font = DATE_FONT;
                    ctx.fillText(`${dateFormatted}  ${rep.time}`, x + CARD_PAD, cy + DATE_H - 10);
                    cy += DATE_H + 12;

                    ctx.fillStyle = '#402b3d';
                    ctx.font = TITLE_FONT;
                    titleLines.forEach(line => {
                        ctx.fillText(line, x + CARD_PAD, cy + TITLE_LINE_H - 10);
                        cy += TITLE_LINE_H;
                    });
                    cy += 14;

                    chipRows.forEach(chipRow => {
                        let cx = x + CARD_PAD;
                        chipRow.forEach(({ ev, label, chipW }) => {
                            const groupObj = groups.find(g => g.name === ev.group);
                            const color = groupObj ? groupObj.color : '#dd5b9d';
                            ctx.fillStyle = /^#[0-9a-fA-F]{6}$/.test(color) ? color + '26' : color;
                            drawRoundRect(ctx, cx, cy, chipW, CHIP_H, CHIP_H / 2);
                            ctx.fill();
                            ctx.fillStyle = color;
                            ctx.font = CHIP_FONT;
                            ctx.fillText(label, cx + CHIP_TEXT_PAD, cy + CHIP_H / 2 + (useGrid ? 8 : 9));
                            cx += chipW + CHIP_GAP;
                        });
                        cy += CHIP_H + 10;
                    });
                });
                y += row.height + ROW_GAP;
            });

            if (extra > 0) {
                ctx.fillStyle = '#96748c';
                ctx.font = '600 28px "M PLUS Rounded 1c", sans-serif';
                ctx.fillText(`ほか ${extra} 件`, PAD, y + 36);
                y += extraNoteH;
            }

            ctx.fillStyle = '#96748c';
            ctx.font = '700 26px ' + SHARE_FONT;
            ctx.fillText('#推し活 #OshiCal', PAD, y + 56);
            shareWordmark_(ctx, WIDTH, y + 56, PAD);

            canvas.toBlob(async (blob) => {
                if (!blob) { alert('画像の作成に失敗しました'); return; }
                const file = new File([blob], 'oshi-cal-schedule.png', { type: 'image/png' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({ files: [file], title: 'Oshi-Cal', text: '推し活スケジュール' });
                        return;
                    } catch (e) { /* キャンセルや失敗時はダウンロードにフォールバック */ }
                }

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'oshi-cal-schedule.png';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                alert('画像を保存したよ。SNSアプリから画像を選んで投稿してね。');
            }, 'image/png');
        }

        async function shareSummaryImage() {
            const s = computeSummary(summaryPeriod);
            if (s.liveCount === 0) { alert('まだ記録がありません'); return; }
            try { await Promise.all([document.fonts.load('800 60px "M PLUS Rounded 1c"'), document.fonts.load('700 30px "M PLUS Rounded 1c"')]); } catch (e) {}

            const WIDTH = 1080;
            const PAD = 70;
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            const topGroups = s.topGroups.slice(0, 5);
            const topVenues = s.topVenues.slice(0, 3);
            const ROW_H = 92;
            const HEADER_H = 300;
            const STAT_H = 190;
            const SECTION_GAP = 60;
            const groupsH = topGroups.length ? 70 + topGroups.length * ROW_H : 0;
            const venuesH = topVenues.length ? 70 + topVenues.length * ROW_H : 0;
            const footerH = 160;
            const hasLogStats = s.totalCheki > 0 || s.totalSpend > 0;
            const statsH = STAT_H + (hasLogStats ? STAT_H + 24 : 0);
            const HEIGHT = HEADER_H + statsH + SECTION_GAP + groupsH + (venuesH ? SECTION_GAP + venuesH : 0) + footerH + PAD;

            canvas.width = WIDTH;
            canvas.height = HEIGHT;

            // 背景：アプリのテーマに合わせた淡ピンクのグラデーション＋柔らかい装飾
            const bg = ctx.createLinearGradient(0, 0, 0, HEIGHT);
            bg.addColorStop(0, '#fff8fb');
            bg.addColorStop(1, '#fdeef7');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            softBlobs_(ctx, WIDTH, HEIGHT);

            // ヘッダー
            ctx.fillStyle = '#96748c';
            ctx.font = '700 29px ' + SHARE_FONT;
            ctx.fillText('MY 推し活まとめ', PAD, 100);
            ctx.fillStyle = '#402b3d';
            ctx.font = '800 66px ' + SHARE_FONT;
            ctx.fillText(s.label, PAD, 178);
            const badgeG2 = ctx.createLinearGradient(WIDTH - PAD - 92, 52, WIDTH - PAD, 144);
            badgeG2.addColorStop(0, '#f9a8d4');
            badgeG2.addColorStop(1, '#d8b4fe');
            ctx.fillStyle = badgeG2;
            drawRoundRect(ctx, WIDTH - PAD - 92, 52, 92, 92, 26);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = '800 50px ' + SHARE_FONT;
            ctx.textAlign = 'center';
            ctx.fillText('推', WIDTH - PAD - 46, 118);
            ctx.textAlign = 'left';

            let y = HEADER_H;

            // 統計カード（参戦本数 / 推しグループ、参戦記録があればチェキ / 金額の行も）
            const statW = (WIDTH - PAD * 2 - 24) / 2;
            const statRows = [
                [
                    { label: '参戦本数', value: `${s.liveCount}`, unit: '本' },
                    { label: '推しグループ', value: `${s.groupCount}`, unit: '組' }
                ]
            ];
            if (hasLogStats) {
                statRows.push([
                    { label: 'チェキ合計', value: `${s.totalCheki}`, unit: '枚' },
                    { label: '使った金額', value: `¥${s.totalSpend.toLocaleString()}`, unit: '' }
                ]);
            }
            statRows.forEach((row, ri) => {
                row.forEach((stat, i) => {
                    const x = PAD + i * (statW + 24);
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowColor = 'rgba(221, 91, 157, 0.13)';
                    ctx.shadowBlur = 24;
                    ctx.shadowOffsetY = 8;
                    drawRoundRect(ctx, x, y, statW, STAT_H, 32);
                    ctx.fill();
                    ctx.shadowColor = 'transparent';
                    ctx.shadowBlur = 0;
                    ctx.shadowOffsetY = 0;
                    ctx.strokeStyle = 'rgba(233, 150, 195, 0.45)';
                    ctx.lineWidth = 2;
                    drawRoundRect(ctx, x, y, statW, STAT_H, 32);
                    ctx.stroke();
                    ctx.fillStyle = '#96748c';
                    ctx.font = '700 26px "M PLUS Rounded 1c", sans-serif';
                    ctx.fillText(stat.label, x + 28, y + 50);
                    ctx.fillStyle = '#402b3d';
                    let vfs = 72;
                    ctx.font = `800 ${vfs}px "M PLUS Rounded 1c", sans-serif`;
                    while (ctx.measureText(stat.value).width > statW - 80 && vfs > 28) {
                        vfs -= 6;
                        ctx.font = `800 ${vfs}px "M PLUS Rounded 1c", sans-serif`;
                    }
                    ctx.fillText(stat.value, x + 28, y + 130);
                    const vw = ctx.measureText(stat.value).width;
                    ctx.font = '700 30px ' + SHARE_FONT;
                    ctx.fillStyle = '#dd5b9d';
                    ctx.fillText(stat.unit, x + 28 + vw + 12, y + 130);
                });
                y += STAT_H + (ri < statRows.length - 1 ? 24 : SECTION_GAP);
            });

            const contentW = WIDTH - PAD * 2;

            function drawRankSection(title, items, dotColorFn) {
                ctx.fillStyle = '#dd5b9d';
                drawRoundRect(ctx, PAD, y + 12, 9, 34, 4);
                ctx.fill();
                ctx.fillStyle = '#402b3d';
                ctx.font = '800 32px ' + SHARE_FONT;
                ctx.fillText(title, PAD + 24, y + 40);
                y += 70;
                items.forEach(([name, count], i) => {
                    ctx.fillStyle = '#ffffff';
                    drawRoundRect(ctx, PAD, y, contentW, ROW_H - 16, 24);
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(233, 150, 195, 0.45)';
                    ctx.lineWidth = 2;
                    drawRoundRect(ctx, PAD, y, contentW, ROW_H - 16, 24);
                    ctx.stroke();

                    const badgeR = 22;
                    const cy = y + (ROW_H - 16) / 2;
                    ctx.fillStyle = dotColorFn(name);
                    ctx.beginPath(); ctx.arc(PAD + 40, cy, badgeR, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '800 24px "M PLUS Rounded 1c", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(String(i + 1), PAD + 40, cy + 8);
                    ctx.textAlign = 'left';

                    ctx.fillStyle = '#402b3d';
                    ctx.font = '700 32px "M PLUS Rounded 1c", sans-serif';
                    ctx.fillText(truncateText(ctx, name, contentW - 220), PAD + 84, cy + 11);

                    ctx.fillStyle = '#94a3b8';
                    ctx.font = '800 30px "M PLUS Rounded 1c", sans-serif';
                    ctx.textAlign = 'right';
                    ctx.fillText(String(count), PAD + contentW - 24, cy + 10);
                    ctx.textAlign = 'left';

                    y += ROW_H;
                });
            }

            if (topGroups.length) {
                drawRankSection('よく観たグループ', topGroups, (name) => {
                    const go = groups.find(g => g.name === name);
                    return go ? go.color : '#dd5b9d';
                });
                y += SECTION_GAP;
            }

            if (topVenues.length) {
                drawRankSection('よく行った会場', topVenues, () => '#a78bfa');
                y += SECTION_GAP;
            }

            // フッター：ハッシュタグ + URL + ワードマーク
            ctx.fillStyle = '#96748c';
            ctx.font = '700 27px ' + SHARE_FONT;
            ctx.fillText('#推し活 #OshiCal', PAD, y + 40);
            ctx.font = '500 23px ' + SHARE_FONT;
            ctx.fillStyle = '#b08ea6';
            ctx.fillText(SITE_URL, PAD, y + 76);
            shareWordmark_(ctx, WIDTH, y + 62, PAD);

            canvas.toBlob(async (blob) => {
                if (!blob) { alert('画像の作成に失敗しました'); return; }
                const file = new File([blob], 'oshi-cal-summary.png', { type: 'image/png' });
                const shareText = `【推し活まとめ ${s.label}】参戦${s.liveCount}本 / ${s.groupCount}組\n#推し活 #OshiCal\n${SITE_URL}`;

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({ files: [file], title: 'Oshi-Cal', text: shareText });
                        return;
                    } catch (e) { /* キャンセル・失敗時はダウンロードにフォールバック */ }
                }

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'oshi-cal-summary.png';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                alert('画像を保存したよ。SNSアプリから画像を選んで投稿してね。');
            }, 'image/png');
        }
</script>
